<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文本清理工具</title>
  <style>
    :root {
      --bg-page: #f4f7fb;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef4fc 0%, var(--bg-page) 220px);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 20px 48px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* 头部 */
    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .page-header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* 双栏主布局 */
    .main-grid {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .link-btn:hover {
      background: #eff6ff;
      color: var(--primary-hover);
    }

    /* 输入区域 */
    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-label-row label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    textarea.text-area {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
      display: block;
    }

    textarea.text-area:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea.text-area::placeholder {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* 实时计数字面板 */
    .live-counter-bar {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 6px;
    }

    @media (max-width: 520px) {
      .live-counter-bar {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .counter-item {
      text-align: center;
      padding: 2px 4px;
      border-right: 1px solid var(--border);
    }

    .counter-item:last-child {
      border-right: none;
    }

    @media (max-width: 520px) {
      .counter-item {
        border-right: none;
      }
    }

    .counter-num {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .counter-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 1px;
      white-space: nowrap;
    }

    /* 清理规则面板 */
    .rules-box {
      margin-top: 14px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .rules-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .rules-header span {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

    @media (max-width: 520px) {
      .rules-grid {
        grid-template-columns: 1fr;
      }
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #334155;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .rules-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .rules-tip {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-top: 10px;
    }

    /* 操作按钮 */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #fff;
      color: #334155;
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover {
      background: #f8fafc;
    }

    .privacy-note {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 右侧结果区 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .stat-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
    }

    .empty-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .result-box {
      display: none;
    }

    .result-box.active {
      display: block;
    }

    .result-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .result-status {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .result-btns {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    .result-textarea {
      width: 100%;
      min-height: 340px;
      resize: vertical;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 14px;
      line-height: 1.65;
      color: #0f172a;
      background: #fcfdff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .result-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* 全屏拖拽遮罩 */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(37, 99, 235, 0.08);
      backdrop-filter: blur(2px);
      border: 2px dashed var(--primary);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
      pointer-events: none;
    }

    .drop-overlay.show {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="drop-overlay" id="dropOverlay">松开鼠标导入文本文件</div>

  <div class="container">
    <header class="page-header">
      <h1>文本清理工具</h1>
      <p>一键移除空行、重复行、首尾空白和各种无用字符，快速整理名单、文章、代码和批量文本。</p>
    </header>

    <main class="main-grid">
      <!-- 左侧设置面板 -->
      <section class="card">
        <div class="card-header">
          <div>
            <div class="card-title">文本清理设置</div>
            <div class="card-subtitle">按需整理每一行文本内容</div>
          </div>
          <button type="button" class="link-btn" id="sampleBtn">查看示例</button>
        </div>

        <div class="input-label-row">
          <label for="inputText">待清理文本</label>
          <button type="button" class="link-btn" id="fileBtn">选择文件</button>
          <input type="file" id="fileInput" accept=".txt,.csv,.md,.log,.json,.html,.xml,text/*" hidden />
        </div>

        <textarea
          id="inputText"
          class="text-area"
          placeholder="粘贴文本，或将文件拖入页面任意位置。输入时下方会实时统计字符数。"
        ></textarea>

        <!-- 实时计数字统计条 -->
        <div class="live-counter-bar" aria-label="实时字符统计">
          <div class="counter-item" title="包含空格、换行和标点的总字符数">
            <div class="counter-num" id="cntTotal">0</div>
            <div class="counter-label">含空格标点</div>
          </div>
          <div class="counter-item" title="移除空格、制表符、换行后的字符数（含标点）">
            <div class="counter-num" id="cntNoSpace">0</div>
            <div class="counter-label">不含空白</div>
          </div>
          <div class="counter-item" title="移除空白和所有中英文标点符号后的字符数">
            <div class="counter-num" id="cntNoPunct">0</div>
            <div class="counter-label">不含标点</div>
          </div>
          <div class="counter-item" title="文本中中英文标点符号的总数量">
            <div class="counter-num" id="cntPunctOnly">0</div>
            <div class="counter-label">标点符号</div>
          </div>
          <div class="counter-item" title="文本中的中文汉字数量">
            <div class="counter-num" id="cntChinese">0</div>
            <div class="counter-label">中文汉字</div>
          </div>
        </div>

        <div class="rules-box">
          <div class="rules-header">
            <span>清理规则</span>
            <button type="button" class="link-btn" id="resetRulesBtn">恢复默认</button>
          </div>

          <div class="rules-grid">
            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemoveEmptyLines" checked />
              <span>移除空行</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemoveDuplicates" checked />
              <span>移除重复行</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="ruleTrimLines" checked />
              <span>清除首尾空白</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="ruleCollapseSpaces" />
              <span>合并行内空白</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemoveInvisible" checked />
              <span>移除不可见字符</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemoveBom" checked />
              <span>移除 BOM 标记</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="ruleStripHtml" />
              <span>移除 HTML 标签</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemovePrefixIndex" />
              <span>移除行首序号</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemoveAllSpaces" checked />
              <span>移除行内所有空白</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="ruleFullToHalf" />
              <span>全角字符转半角</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="ruleTrimQuotes" />
              <span>去除首尾引号</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="ruleTrimPunctuation" />
              <span>移除行尾标点</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" id="ruleRemoveAllNewlines" />
              <span>移除所有换行</span>
            </label>
          </div>

          <div class="rules-divider"></div>

          <label class="checkbox-item">
            <input type="checkbox" id="ruleIgnoreCase" />
            <span>重复行判断时忽略大小写</span>
          </label>

          <p class="rules-tip">
            行首序号、首尾引号、行尾标点、移除所有换行和行内全部空白等规则默认关闭，请根据文本内容谨慎开启。
          </p>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="cleanBtn">✦ 开始清理</button>
          <button type="button" class="btn btn-secondary" id="clearBtn">清空数据</button>
        </div>

        <div class="privacy-note">🔒 文本仅在当前浏览器本地处理，不会上传到服务器。</div>
      </section>

      <!-- 右侧结果面板 -->
      <section class="card">
        <div class="card-header">
          <div>
            <div class="card-title">清理结果</div>
            <div class="card-subtitle">保留原有顺序，按启用规则处理</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">原始行数</div>
            <div class="stat-value" id="statOriginalLines">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">结果行数</div>
            <div class="stat-value" id="statResultLines">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">移除行数</div>
            <div class="stat-value" id="statRemovedLines">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">结果字数</div>
            <div class="stat-value" id="statResultChars">0</div>
          </div>
        </div>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon">✎</div>
          <div class="empty-title">暂无清理结果</div>
          <div class="empty-desc">输入或拖入文本后，选择需要的清理规则并点击“开始清理”。</div>
        </div>

        <div class="result-box" id="resultBox">
          <div class="result-toolbar">
            <span class="result-status" id="resultStatus">已生成清理结果</span>
            <div class="result-btns">
              <button type="button" class="btn btn-secondary btn-sm" id="copyBtn">复制结果</button>
              <button type="button" class="btn btn-secondary btn-sm" id="downloadBtn">下载 .txt</button>
            </div>
          </div>
          <textarea id="outputText" class="result-textarea" readonly></textarea>
        </div>
      </section>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const DEFAULT_RULES = {
      ruleRemoveEmptyLines: true,
      ruleRemoveDuplicates: true,
      ruleTrimLines: true,
      ruleCollapseSpaces: false,
      ruleRemoveInvisible: true,
      ruleRemoveBom: true,
      ruleStripHtml: false,
      ruleRemovePrefixIndex: false,
      ruleRemoveAllSpaces: true,
      ruleFullToHalf: false,
      ruleTrimQuotes: false,
      ruleTrimPunctuation: false,
      ruleRemoveAllNewlines: false,
      ruleIgnoreCase: false
    };

    const SAMPLE_TEXT = `\uFEFF1.  “苹果 Apple”  ，
2. 苹果 apple

3. <p>香蕉   Banana</p>！
4. “橙子   Orange”。
5.   苹果 Apple  \u200B
6. 葡萄   Grape？`;

    // 实时更新输入统计
    function updateLiveCounts() {
      const text = $("inputText").value;
      if (!text) {
        $("cntTotal").textContent = "0";
        $("cntNoSpace").textContent = "0";
        $("cntNoPunct").textContent = "0";
        $("cntPunctOnly").textContent = "0";
        $("cntChinese").textContent = "0";
        return;
      }

      // 使用 Array.from 避免 emoji 或生僻字代理对被拆成 2 个长度
      const totalChars = Array.from(text).length;

      // 移除所有空白符（空格、制表符、换行等）
      const noSpaceText = text.replace(/\s+/g, "");
      const noSpaceChars = Array.from(noSpaceText).length;

      // 匹配中英文标点符号（基于 Unicode 标点属性 \p{P} 以及常见符号补充）
      const punctRegex = /[\p{P}\p{S}]/gu;
      const punctMatches = noSpaceText.match(punctRegex);
      const punctCount = punctMatches ? punctMatches.length : 0;

      // 不含标点且不含空白的纯字符数
      const noPunctText = noSpaceText.replace(punctRegex, "");
      const noPunctChars = Array.from(noPunctText).length;

      // 中文汉字统计
      const chineseMatches = text.match(/[\u4E00-\u9FFF\u3400-\u4DBF]/g);
      const chineseCount = chineseMatches ? chineseMatches.length : 0;

      $("cntTotal").textContent = String(totalChars);
      $("cntNoSpace").textContent = String(noSpaceChars);
      $("cntNoPunct").textContent = String(noPunctChars);
      $("cntPunctOnly").textContent = String(punctCount);
      $("cntChinese").textContent = String(chineseCount);
    }

    function getRules() {
      const rules = {};
      Object.keys(DEFAULT_RULES).forEach((key) => {
        rules[key] = $(key).checked;
      });
      return rules;
    }

    function applyDefaultRules() {
      Object.entries(DEFAULT_RULES).forEach(([key, val]) => {
        $(key).checked = val;
      });
    }

    function fullWidthToHalfWidth(str) {
      return str.replace(/[\uFF01-\uFF5E]/g, (ch) =>
        String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
      ).replace(/\u3000/g, " ");
    }

    function cleanSingleLine(line, rules) {
      let s = line;

      if (rules.ruleRemoveBom) {
        s = s.replace(/^\uFEFF/, "");
      }

      if (rules.ruleRemoveInvisible) {
        s = s.replace(/[\u200B-\u200D\uFEFF\u00AD\u2060\u0000-\u0008\u000B-\u001F\u007F]/g, "");
      }

      if (rules.ruleFullToHalf) {
        s = fullWidthToHalfWidth(s);
      }

      if (rules.ruleStripHtml) {
        s = s.replace(/<[^>]*>/g, "");
      }

      if (rules.ruleTrimLines) {
        s = s.trim();
      }

      if (rules.ruleRemovePrefixIndex) {
        s = s.replace(/^(?:[\(（]?\d+[\)）]?[.、．:：\-])\s*/, "");
      }

      if (rules.ruleTrimQuotes) {
        s = s.replace(/^[“"‘'「『《]+|[”"’'」』》]+$/g, "");
      }

      if (rules.ruleTrimPunctuation) {
        s = s.replace(/[，。！？；：,.!?;:、…～~]+$/g, "");
      }

      if (rules.ruleRemoveAllSpaces) {
        s = s.replace(/\s+/g, "");
      } else if (rules.ruleCollapseSpaces) {
        s = s.replace(/[ \t\u00A0]+/g, " ");
      }

      if (rules.ruleTrimLines) {
        s = s.trim();
      }

      return s;
    }

    function runClean() {
      const raw = $("inputText").value;
      if (!raw) {
        $("statOriginalLines").textContent = "0";
        $("statResultLines").textContent = "0";
        $("statRemovedLines").textContent = "0";
        $("statResultChars").textContent = "0";
        $("emptyState").style.display = "flex";
        $("resultBox").classList.remove("active");
        return;
      }

      const rules = getRules();
      const rawLines = raw.split(/\r\n|\r|\n/);
      const originalLineCount = rawLines.length;

      const seen = new Set();
      const processedLines = [];

      for (const rawLine of rawLines) {
        const cleanedLine = cleanSingleLine(rawLine, rules);

        if (rules.ruleRemoveEmptyLines && cleanedLine.length === 0) {
          continue;
        }

        if (rules.ruleRemoveDuplicates) {
          const dedupKey = rules.ruleIgnoreCase ? cleanedLine.toLowerCase() : cleanedLine;
          if (seen.has(dedupKey)) {
            continue;
          }
          seen.add(dedupKey);
        }

        processedLines.push(cleanedLine);
      }

      const finalText = rules.ruleRemoveAllNewlines
        ? processedLines.join("")
        : processedLines.join("\n");

      const resultLineCount = finalText.length === 0 ? 0 : finalText.split("\n").length;
      const removedLineCount = Math.max(0, originalLineCount - resultLineCount);
      const resultCharCount = Array.from(finalText).length;

      $("statOriginalLines").textContent = String(originalLineCount);
      $("statResultLines").textContent = String(resultLineCount);
      $("statRemovedLines").textContent = String(removedLineCount);
      $("statResultChars").textContent = String(resultCharCount);

      $("outputText").value = finalText;
      $("resultStatus").textContent = rules.ruleRemoveAllNewlines
        ? "已启用“移除所有换行”，结果已合并为单行"
        : `保留原有顺序，共输出 ${resultLineCount} 行`;

      $("emptyState").style.display = "none";
      $("resultBox").classList.add("active");
    }

    function readTextFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        $("inputText").value = e.target.result || "";
        updateLiveCounts();
        runClean();
      };
      reader.readAsText(file, "UTF-8");
    }

    // 输入框实时监听（含中文输入法粘贴/输入）
    $("inputText").addEventListener("input", updateLiveCounts);

    // 按钮事件绑定
    $("cleanBtn").addEventListener("click", runClean);

    $("clearBtn").addEventListener("click", () => {
      $("inputText").value = "";
      $("outputText").value = "";
      updateLiveCounts();
      runClean();
    });

    $("resetRulesBtn").addEventListener("click", () => {
      applyDefaultRules();
      if ($("inputText").value) {
        runClean();
      }
    });

    $("sampleBtn").addEventListener("click", () => {
      $("inputText").value = SAMPLE_TEXT;
      updateLiveCounts();
      runClean();
    });

    $("fileBtn").addEventListener("click", () => $("fileInput").click());
    $("fileInput").addEventListener("change", (e) => {
      readTextFile(e.target.files[0]);
      e.target.value = "";
    });

    // 全屏拖入文件支持
    let dragCounter = 0;
    window.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragCounter++;
      $("dropOverlay").classList.add("show");
    });

    window.addEventListener("dragover", (e) => {
      e.preventDefault();
    });

    window.addEventListener("dragleave", () => {
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        $("dropOverlay").classList.remove("show");
      }
    });

    window.addEventListener("drop", (e) => {
      e.preventDefault();
      dragCounter = 0;
      $("dropOverlay").classList.remove("show");
      const file = e.dataTransfer?.files?.[0];
      if (file) {
        readTextFile(file);
      }
    });

    // 复制与下载
    $("copyBtn").addEventListener("click", async () => {
      const text = $("outputText").value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const oldText = $("copyBtn").textContent;
        $("copyBtn").textContent = "已复制 ✓";
        setTimeout(() => ($("copyBtn").textContent = oldText), 1500);
      } catch {
        $("outputText").select();
        document.execCommand("copy");
      }
    });

    $("downloadBtn").addEventListener("click", () => {
      const text = $("outputText").value;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cleaned-text.txt";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
